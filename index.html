<!DOCTYPE html>
<!-- 판매/재고/수급 현황 PWA — PC 화면. data/data.json 을 읽어 품명별 일별 판매·재고와 수급(생산/수입) 일정을 보여준다 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매/재고/수급 현황 (수량)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#465CE2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* applemood 토큰 + 표 헤더는 기준 블루 #465CE2 */
:root{--ink:#1D1D1F;--g2:#6E6E73;--g3:#86868B;--bg:#FFFFFF;--pch:#F5F5F7;--hair:#E0E0E0;--blue:#0066CC;--red:#E30000;--th:#465CE2;--th2:#595959;--inner:#7F7F7F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:400;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding:30px 40px 50px}
h1{font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-0.015em}
h1 .u{font-weight:400;color:var(--g2)}
.sub{color:var(--g2);font-size:13px;margin-bottom:18px}
.sub b{color:var(--ink);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-radius:18px;background:var(--pch);margin-bottom:8px}
.bar .lb{font-weight:600;min-width:36px}
select,input[type=text]{height:34px;border:1px solid var(--hair);border-radius:8px;padding:0 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
select{min-width:130px}
input[type=text]{width:230px}
select:focus,input[type=text]:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
button{height:34px;border:1px solid var(--hair);border-radius:8px;padding:0 16px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer}
button.p{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
button:hover{border-color:var(--g3)}
button.p:hover{background:#0055AA;border-color:#0055AA}
.seg{display:inline-flex;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:2px}
.seg button{border:0;border-radius:6px;background:transparent;color:var(--g2);font-weight:600;padding:0 22px;height:28px}
.seg button.on{background:var(--ink);color:#fff}
.right{margin-left:auto}
.cnt{color:var(--g3);font-size:12px;margin:10px 2px 8px;display:flex;gap:16px;flex-wrap:wrap}
#off{display:none;background:var(--pch);border:1px solid var(--hair);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--g2);margin-bottom:10px}
/* 표 (graymood + 블루 헤더) */
.tblwrap{overflow:auto;max-height:calc(100vh - 230px);border:1.5px solid var(--ink)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--inner);border-right:1px solid var(--inner);padding:0 10px;height:32px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
th{position:sticky;top:0;background:var(--th);color:#fff;font-weight:600;text-align:center;z-index:3}
th.dim,td.dim{text-align:left}
td.dim{background:#fff}
tr:last-child td{border-bottom:0}
tr:hover td{background:#FAFAFA}
td.tot,th.tot{font-weight:600}
td.tot{background:var(--pch)}
td.cur{font-weight:600;color:var(--th)}   /* 현재고는 기준 블루 */
td.turn{color:var(--g2)}
td.turn.low,td.turn.zero{color:var(--red);font-weight:600}
td.clk{cursor:pointer}
td.clk:hover{outline:2px solid var(--blue);outline-offset:-2px}
td.in{color:var(--red);font-weight:700}
td.out{background:var(--pch);color:#B0B0B5}
td.z{color:#C7C7CC}
td.na{color:#D6D6DB}
.stk{position:sticky;background:#fff;z-index:2}
th.stk{background:var(--th);z-index:4}   /* .stk 가 th 규칙보다 우선순위가 높아 헤더가 흰색이 되던 문제 */
#tb.sv th,#tb.sv th.stk{background:var(--th2)}   /* 재고 VIEW 는 헤더를 진한 회색으로 */
.c1,.c2,.c3,.c4,.c5,.c6,.c7{overflow:hidden;text-overflow:ellipsis}
.c8{left:662px;width:74px;min-width:74px;max-width:74px}
.c9{left:736px;width:66px;min-width:66px;max-width:66px}
td.c9,th.c9{border-right:1.5px solid var(--ink)}          /* 판매뷰 틀고정 경계 = 회전일 뒤 */
.c1{left:0;width:80px;min-width:80px;max-width:80px}
.c2{left:80px;width:90px;min-width:90px;max-width:90px}
.c3{left:170px;width:130px;min-width:130px;max-width:130px}
.c4{left:300px;width:160px;min-width:160px;max-width:160px}
.c5{left:460px;width:60px;min-width:60px;max-width:60px;text-align:center!important}
.c6{left:520px;width:86px;min-width:86px;max-width:86px}
.c7{left:606px;width:56px;min-width:56px;max-width:56px;text-align:center!important}
#tb.sv td.c7,#tb.sv th.c7{border-right:1.5px solid var(--ink)}   /* 재고뷰 틀고정 경계 = 입고 뒤 */
td.c7 a{color:var(--blue);font-weight:600;cursor:pointer}
td.c7 a:hover{text-decoration:underline}
td.c4 b{font-weight:600}
td.c5{color:var(--g2)}
td.c6{color:var(--g2)}
td.c6.eol{color:var(--red);font-weight:600}
.legend{margin-top:12px;font-size:12px;color:var(--g3);line-height:1.8}
.legend b{color:var(--ink);font-weight:600}
/* 팝업 */
#dim{position:fixed;inset:0;background:rgba(29,29,31,.4);display:none;align-items:center;justify-content:center;z-index:50}
#pop{background:#fff;border:1px solid var(--hair);border-radius:18px;min-width:460px;max-width:92vw;max-height:80vh;overflow:auto}
#pop .hd{padding:20px 24px 12px;font-weight:600;font-size:17px;letter-spacing:-0.015em;display:flex;align-items:center}
#pop .hd .x{margin-left:auto;cursor:pointer;font-weight:400;color:var(--g3);font-size:16px}
#pop .bd{padding:0 24px 22px}
#pop table{width:100%;border:1.5px solid var(--ink)}
#pop th{position:static;background:var(--th);color:#fff}
#pop td.l,#pop th.l{text-align:left}
#pop tr.sum td{font-weight:600;background:var(--pch)}
#pop tr.past td{color:#B0B0B5}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--pch);border:1px solid var(--hair)}
.tag.imp{color:var(--blue);border-color:var(--blue)}
.ex{color:var(--g3);font-size:12px;margin-top:12px;line-height:1.7}
.empty{color:var(--g3);padding:24px;text-align:center}
@media (max-width:900px){.wrap{padding:16px 12px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<h1>판매/재고/수급 현황 <span class="u">(수량)</span></h1>
<div class="sub" id="sub">데이터 불러오는 중…</div>
<div id="off"></div>

<div class="bar">
  <span class="lb">유형</span>
  <select id="fL"><option value="">대유형 전체</option></select>
  <select id="fM"><option value="">중유형 전체</option></select>
  <select id="fS"><option value="">소유형 전체</option></select>
  <input type="text" id="fQ" placeholder="품명 (부분일치)">
  <button class="p" onclick="render()">검색</button>
  <button onclick="resetF()">초기화</button>
</div>
<div class="bar">
  <span class="lb">기간</span>
  <select id="fYM"></select>
  <span class="lb" style="margin-left:14px">VIEW</span>
  <div class="seg"><button id="vS" class="on" onclick="setView('sales')">판매</button><button id="vI" onclick="setView('stock')">재고</button></div>
  <span class="lb" style="margin-left:14px">회전일</span>
  <select id="fT" title="현재고 ÷ 일평균 판매">
    <option value="">전체</option>
    <option value="out">품절 (재고 0)</option>
    <option value="0-15">15일 미만</option>
    <option value="15-30">15~30일</option>
    <option value="30-60">30~60일</option>
    <option value="60-">60일 이상</option>
    <option value="none">산출 불가 (판매 없음)</option>
  </select>
  <span class="lb" style="margin-left:14px">제상품</span>
  <select id="fJ" title="상품코드집 상제품"><option value="">전체</option></select>
  <button class="right" onclick="exportXlsx()">⬇ 엑셀 내보내기</button>
</div>

<div class="cnt" id="cnt"></div>
<div class="tblwrap"><table id="tb"><thead></thead><tbody></tbody></table></div>

<div class="legend" id="legend"></div>
</div>

<div id="dim" onclick="if(event.target===this)closeP()">
  <div id="pop"><div class="hd"><span id="pt"></span><span class="x" onclick="closeP()">✕</span></div><div class="bd" id="pb"></div></div>
</div>

<script>
let D=null, view='sales', _rows=[];
const $=id=>document.getElementById(id);
const fmt=n=>(n==null||n==='')?'':Number(n).toLocaleString('ko-KR');
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const md=iso=>iso.slice(5,7).replace(/^0/,'')+'/'+iso.slice(8,10).replace(/^0/,'');

async function load(){
  try{
    const r=await fetch('data/data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    D=await r.json();
  }catch(e){
    $('off').style.display='block'; $('off').textContent='데이터를 불러오지 못했습니다 ('+e.message+'). 네트워크를 확인하고 새로고침해 주세요.';
    return;
  }
  const a=D.asof;
  $('sub').innerHTML='데이터 기준 &nbsp;판매 <b>'+a.sales+'</b> · 재고 <b>'+(a.stock||'-')+'</b> · 생산계획 <b>'+a.prod+'</b> · 수입일정 <b>'+a.imp+'</b> &nbsp;·&nbsp; 빌드 '+D.built;
  const ym=$('fYM'); ym.innerHTML=D.months.slice().reverse().map(m=>'<option>'+m+'</option>').join('');
  ym.addEventListener('change',render);
  $('fT').addEventListener('change',render);
  $('fJ').addEventListener('change',render);
  opts(); render();
  $('legend').innerHTML='<b>회전일</b> = 현재고 ÷ 최근 '+D.rules.avgDays+'일 일평균 판매 (15일 미만 빨강, 현재고 0 = 품절) &nbsp;·&nbsp; '
   +'<b>재고 빨간 볼드</b> = 전일 대비 +'+D.rules.inflow+' 이상 입고 &nbsp;·&nbsp; <b>입고 [일정]</b> = 오늘 이후 생산계획·수입일정 있음 &nbsp;·&nbsp; '
   +'판매 셀 클릭 → 채널·거래처 상세 &nbsp;·&nbsp; <b>회전일 필터</b>로 품절·소진임박 품목만 추릴 수 있음<br>'
   +'<b>표시 품목</b> = 상품코드집 ∪ 판매실적 중 최근 활동 있는 품목(코드집 순서). '
   +'<b>운영</b>에 \'단종\'이 포함되고 현재고 '+D.rules.eolStock+'개 이하면 제외(당월 판매가 있으면 유지). '
   +'<b>대시보드노출제외상품.xlsx</b> 에 적힌 품목도 제외';
}
function fill(sel,vals,ph){const cur=sel.value;sel.innerHTML='<option value="">'+ph+'</option>'+vals.map(v=>'<option'+(v===cur?' selected':'')+'>'+v+'</option>').join('');}
function opts(){
  const L=$('fL').value,M=$('fM').value;
  const u=a=>[...new Set(a.filter(Boolean))];
  fill($('fL'),u(D.items.map(i=>i.cat[0])),'대유형 전체');
  fill($('fM'),u(D.items.filter(i=>!L||i.cat[0]===L).map(i=>i.cat[1])),'중유형 전체');
  fill($('fS'),u(D.items.filter(i=>(!L||i.cat[0]===L)&&(!M||i.cat[1]===M)).map(i=>i.cat[2])),'소유형 전체');
  fill($('fJ'),u(D.items.map(i=>i.jp)).sort(),'전체');
}
['fL','fM','fS'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='fL')$('fM').value='';if(id!=='fS')$('fS').value='';opts();render();}));
$('fQ').addEventListener('keydown',e=>{if(e.key==='Enter')render()});
function resetF(){['fL','fM','fS','fT','fJ'].forEach(id=>$(id).value='');$('fQ').value='';opts();render();}
function setView(v){view=v;$('vS').classList.toggle('on',v==='sales');$('vI').classList.toggle('on',v==='stock');$('tb').classList.toggle('sv',v==='stock');render();}
function turnOf(it){ return it.avg>0?Math.round(it.cur/it.avg):null; }   // 회전일 = 현재고 ÷ 일평균 판매
function turnHit(it,f){
  if(!f) return true;
  if(f==='out') return it.cur===0;
  const t=turnOf(it);
  if(f==='none') return t===null;
  if(t===null) return false;
  const [a,b]=f.split('-');
  return t>=Number(a) && (b===''||t<Number(b));
}
function filtered(){
  const L=$('fL').value,M=$('fM').value,S=$('fS').value,Q=$('fQ').value.trim().toUpperCase(),T=$('fT').value,J=$('fJ').value;
  return D.items.filter(i=>(!L||i.cat[0]===L)&&(!M||i.cat[1]===M)&&(!S||i.cat[2]===S)&&(!Q||i.pn.toUpperCase().includes(Q))&&turnHit(i,T)&&(!J||(i.jp||'')===J));
}
function hasFuture(it){return it.sup.some(x=>x[1]>=D.asof.today);}
function visDays(ym){
  // 그 달의 날짜 중 데이터 기준일까지만 (미래 열 제거)
  const lim=view==='sales'?D.asof.sales:(D.asof.stock||D.asof.sales);
  return D.days[ym].filter(d=>d<=lim);
}
function render(){
  if(!D) return;
  const ym=$('fYM').value||D.months[D.months.length-1];
  const days=visDays(ym); const n=days.length;
  const rows=filtered(); _rows=rows;
  const th=$('tb').querySelector('thead'), tb=$('tb').querySelector('tbody');
  let h='<tr><th class="dim stk c1">대유형</th><th class="dim stk c2">중유형</th><th class="dim stk c3">소유형</th><th class="dim stk c4">품명</th><th class="dim stk c5" title="상품코드집 상제품 (제품/상품)">제상품</th><th class="dim stk c6" title="상품코드집 운영 상태">운영</th><th class="dim stk c7" title="수급일정(생산·수입) 있으면 일정">입고</th>';
  if(view==='sales') h+='<th class="stk c8" title="'+D.asof.stock+' 재고">현재고</th><th class="stk c9" title="현재고 ÷ '+D.rules.avgDays+'일 일평균 판매">회전일</th>';
  for(let k=n-1;k>=0;k--) h+='<th>'+md(days[k])+'</th>';
  if(view==='sales') h+='<th class="tot">월합계</th>';
  th.innerHTML=h+'</tr>';
  tb.innerHTML=rows.map((it,ri)=>{
    let r='<td class="dim stk c1">'+it.cat[0]+'</td><td class="dim stk c2">'+it.cat[1]+'</td><td class="dim stk c3">'+it.cat[2]+'</td><td class="dim stk c4"><b>'+it.pn+'</b></td>'
         +'<td class="dim stk c5">'+(it.jp||'')+'</td>'
         +'<td class="dim stk c6'+((it.op||'').indexOf('단종')>=0?' eol':'')+'">'+(it.op||'')+'</td>'
         +'<td class="dim stk c7">'+(hasFuture(it)?'<a onclick="popI('+ri+')">일정</a>':'')+'</td>';
    if(view==='sales'){
      const s=it.s[ym]||[]; const turn=turnOf(it);
      r+='<td class="cur stk c8">'+fmt(it.cur)+'</td>';
      r+=it.cur===0?'<td class="turn zero stk c9">품절</td>':'<td class="turn stk c9'+(turn!=null&&turn<D.rules.lowTurn?' low':'')+'">'+(turn==null?'-':fmt(turn)+'일')+'</td>';
      for(let k=n-1;k>=0;k--){const v=s[k]||0;r+='<td class="clk'+(v?'':' z')+'" onclick="popS('+ri+',\''+ym+'\','+(k+1)+')">'+fmt(v)+'</td>';}
      r+='<td class="tot">'+fmt(sum(s.slice(0,n)))+'</td>';
    }else{
      const s=it.k[ym]||[]; const prev0=(it.k0&&it.k0[ym]!=null)?it.k0[ym]:null;
      for(let k=n-1;k>=0;k--){
        const v=s[k]; if(v==null){r+='<td class="na">·</td>';continue;}
        let p=null; for(let j=k-1;j>=0;j--){if(s[j]!=null){p=s[j];break;}} if(p==null&&k===0)p=prev0;
        const cls=v===0?'out':(p!=null&&v-p>=D.rules.inflow?'in':'');
        r+='<td class="'+cls+'"'+(cls==='in'?' title="전일 대비 +'+fmt(v-p)+'"':'')+'>'+fmt(v)+'</td>';
      }
    }
    return '<tr>'+r+'</tr>';
  }).join('');
  $('cnt').innerHTML='<span>품목 '+rows.length+'개</span><span>'+ym+' · '+(view==='sales'?'판매수량(일별)':'재고수량(일별)')+'</span>';
}
function popS(ri,ym,day){
  const it=_rows[ri], det=(it.d[ym]||{})[String(day)]||[];
  let b;
  if(!det.length) b='<div class="empty">해당일 판매 없음</div>';
  else{
    b='<table><thead><tr><th class="l">분석채널</th><th class="l">거래처</th><th>수량</th></tr></thead><tbody>'
     +det.map(x=>'<tr><td class="l">'+D.ch[x[0]]+'</td><td class="l">'+D.cu[x[1]]+'</td><td>'+fmt(x[2])+'</td></tr>').join('')
     +'<tr class="sum"><td class="l">합계</td><td class="l"></td><td>'+fmt(sum(det.map(x=>x[2])))+'</td></tr></tbody></table>';
  }
  openP(it.pn+' · '+ym.replace('.','/')+'/'+day+' 판매 상세',b);
}
function popI(ri){
  const it=_rows[ri], today=D.asof.today;
  const rows=it.sup.map(x=>'<tr'+(x[1]<today?' class="past"':'')+'><td class="l"><span class="tag'+(x[0]==='수입'?' imp':'')+'">'+x[0]+'</span></td>'
    +'<td class="l">'+x[1]+(x[3]==='ETA'?' <span style="color:#86868B">(ETA)</span>':'')+(x[1]<today?' <span style="font-size:11px">지남</span>':'')+'</td>'
    +'<td>'+fmt(x[2])+'</td><td class="l" style="color:#86868B">'+(x[4]||'')+'</td></tr>').join('');
  const fut=it.sup.filter(x=>x[1]>=today);
  const b='<table><thead><tr><th class="l">구분</th><th class="l">일자</th><th>수량</th><th class="l">NO.</th></tr></thead><tbody>'+rows
    +'<tr class="sum"><td class="l">오늘 이후 합계</td><td class="l"></td><td>'+fmt(sum(fut.map(x=>x[2])))+'</td><td></td></tr></tbody></table>'
    +'<div class="ex">현재고 '+fmt(it.cur)+' · 일평균 판매 '+it.avg+' · 생산 = 일자별 자재계획(계획수량) · 수입 = 김포입고일 우선, 없으면 ETA</div>';
  openP(it.pn+' · 수급 일정',b);
}
function openP(t,b){$('pt').textContent=t;$('pb').innerHTML=b;$('dim').style.display='flex';}
function closeP(){$('dim').style.display='none';}

/* ── 엑셀(xlsx) 내보내기 ─────────────────────────────────────────────
   시트 2개(본표 + 수급상세)가 필요해 CSV 로는 안 되고, 외부 라이브러리 없이(오프라인 유지)
   xlsx = ZIP(무압축 store) + XML 이라는 구조를 직접 만든다. */
const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crcT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){   // [{name, data:Uint8Array}] → Uint8Array (method 0)
  const enc=new TextEncoder(); const parts=[], central=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), n=f.data.length;
    const lh=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(n),...u32(n),...u16(nm.length),...u16(0)];
    parts.push(new Uint8Array(lh),nm,f.data);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(n),...u32(n),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)],nm);
    off+=lh.length+nm.length+n;
  }
  const cd=[]; let cdLen=0;
  for(let i=0;i<central.length;i+=2){const a=new Uint8Array(central[i]);cd.push(a,central[i+1]);cdLen+=a.length+central[i+1].length;}
  const cnt=files.length;
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cnt),...u16(cnt),...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,end]; const total=all.reduce((s,a)=>s+a.length,0);
  const out=new Uint8Array(total); let p=0; for(const a of all){out.set(a,p);p+=a.length;}
  return out;
}
const xesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function colRef(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26;}return s;}
function sheetXml(rows){   // rows: 값 배열의 배열. 숫자는 숫자셀, 나머지는 문자셀
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      if(v===null||v===undefined||v==='') return;
      const ref=colRef(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v)) x+='<c r="'+ref+'"><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function makeXlsx(sheets){   // [{name, rows}]
  const enc=new TextEncoder(), f=[];
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>';
  f.push({name:'[Content_Types].xml',data:enc.encode(ct)});
  f.push({name:'_rels/.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  f.push({name:'xl/workbook.xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    +sheets.map((s,i)=>'<sheet name="'+xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>')});
  f.push({name:'xl/_rels/workbook.xml.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'</Relationships>')});
  sheets.forEach((s,i)=>f.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:enc.encode(sheetXml(s.rows))}));
  return zipStore(f);
}
function exportXlsx(){
  if(!D) return;
  const num=s=>{if(s==='·')return '';const v=s.replace(/,/g,'');return (v!==''&&/^-?\d+(\.\d+)?$/.test(v))?Number(v):s;};
  // 시트1 — 화면에 보이는 표 그대로 (입고 열은 '일정' 텍스트)
  const ths=[...$('tb').querySelectorAll('thead th')].map(t=>t.textContent);
  const s1=[ths];
  $('tb').querySelectorAll('tbody tr').forEach(tr=>s1.push([...tr.children].map(td=>num(td.textContent.trim()))));
  // 시트2 — 화면에 남은 품목들의 수급 일정 상세 (팝업과 같은 내용)
  const today=D.asof.today;
  const s2=[['품명','제상품','구분','일자','일자기준','수량','NO.','상태','현재고','일평균 판매']];
  _rows.forEach(it=>(it.sup||[]).forEach(x=>s2.push([it.pn,it.jp||'',x[0],x[1],x[3]||'',x[2],x[4]||'',x[1]<today?'지남':'예정',it.cur,it.avg])));
  if(s2.length===1) s2.push(['(해당 품목의 수급 일정 없음)']);
  const ym=$('fYM').value.replace('.','');
  const name='판매재고수급_'+ym+'_'+(view==='sales'?'판매':'재고')+'.xlsx';
  const blob=new Blob([makeXlsx([{name:view==='sales'?'판매':'재고',rows:s1},{name:'수급상세',rows:s2}])],
                      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
